<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WordLens — 単語データベース</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Filter chips */
    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .filter-chip {
      padding: 5px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--bg-card);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      color: var(--text-secondary);
    }
    .filter-chip:hover { border-color: var(--primary-light); color: var(--primary); }
    .filter-chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* Sort select */
    .sort-select {
      padding: 6px 12px;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-card);
      cursor: pointer;
      outline: none;
      transition: border-color var(--transition);
    }
    .sort-select:focus { border-color: var(--primary-light); }

    /* Word list */
    #word-list { display: flex; flex-direction: column; gap: 8px; }

    .word-item {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: var(--shadow-sm);
    }
    .word-item:hover {
      border-color: var(--border-focus);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }
    .word-item.mastered { border-color: #A7F3D0; background: #F0FDF4; }

    .word-avatar {
      width: 42px; height: 42px;
      background: var(--primary-subtle);
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--primary);
      flex-shrink: 0;
      text-transform: uppercase;
    }
    .word-item.mastered .word-avatar {
      background: #D1FAE5;
      color: #059669;
    }

    .word-body { flex: 1; min-width: 0; }
    .word-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 2px;
    }
    .word-context-preview {
      font-size: 0.78rem;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .word-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    .review-count-dot {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--primary-subtle);
      display: grid;
      place-items: center;
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--primary);
    }

    /* Detail modal */
    .detail-word-display {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }
    .detail-source {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    .detail-context {
      background: var(--bg);
      border-left: 3px solid var(--primary-light);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 10px 14px;
      font-size: 0.88rem;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 14px;
    }
    .detail-context .hl {
      background: #BFDBFE;
      color: var(--primary-dark);
      border-radius: 3px;
      padding: 0 2px;
      font-weight: 700;
    }
    .detail-meta-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .detail-meta-item {
      background: var(--bg);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      text-align: center;
    }
    .detail-meta-val {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--primary);
    }
    .detail-meta-lbl {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    .next-review-info {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    /* Pagination */
    #pagination {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    /* Stats overview */
    .overview-bar {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      gap: 0;
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
    }
    .ov-item {
      flex: 1;
      text-align: center;
      padding: 4px 0;
    }
    .ov-item + .ov-item {
      border-left: 1px solid var(--border);
    }
    .ov-val {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.1;
    }
    .ov-lbl {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 2px;
    }
  </style>
</head>
<body>

<!-- Header -->
<header class="app-header">
  <div class="app-header-inner">
    <a href="index.html" class="logo">
      <span class="logo-icon"><i class="fa fa-book-open"></i></span>
      WordLens
    </a>
    <span class="header-title">単語データベース</span>
  </div>
</header>

<!-- Main -->
<main class="app-container">
  <div class="page-hero">
    <h1>単語データベース <span id="total-count-label" style="font-size:1rem;color:var(--text-muted);font-weight:500;"></span></h1>
    <p>登録済みの英単語を一覧・検索・管理</p>
  </div>

  <!-- Overview -->
  <div class="overview-bar" id="overview-bar">
    <div class="ov-item">
      <div class="ov-val" id="ov-total">—</div>
      <div class="ov-lbl">総単語数</div>
    </div>
    <div class="ov-item">
      <div class="ov-val" id="ov-due" style="color:var(--warning);">—</div>
      <div class="ov-lbl">要復習</div>
    </div>
    <div class="ov-item">
      <div class="ov-val" id="ov-mastered" style="color:var(--success);">—</div>
      <div class="ov-lbl">習得済み</div>
    </div>
  </div>

  <!-- Search -->
  <div style="margin-bottom:12px;">
    <input type="text" class="form-input" id="search-input" placeholder="🔍  単語・出典で検索…">
  </div>

  <!-- Filter + Sort -->
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
    <div class="filter-bar" style="margin-bottom:0;">
      <button class="filter-chip active" data-filter="all" onclick="setFilter('all')">すべて</button>
      <button class="filter-chip" data-filter="due" onclick="setFilter('due')">🔔 要復習</button>
      <button class="filter-chip" data-filter="mastered" onclick="setFilter('mastered')">✅ 習得済み</button>
      <button class="filter-chip" data-filter="new" onclick="setFilter('new')">🆕 未学習</button>
    </div>
    <select class="sort-select" id="sort-select" onchange="loadWords()">
      <option value="newest">新着順</option>
      <option value="oldest">登録順</option>
      <option value="alpha">A→Z</option>
      <option value="review">復習回数</option>
    </select>
  </div>

  <div id="word-list"></div>
  <div id="pagination"></div>

</main>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <a href="index.html" class="nav-item" data-href="index.html">
    <span class="nav-icon">🏠</span><span>ホーム</span>
  </a>
  <a href="articles.html" class="nav-item" data-href="articles.html">
    <span class="nav-icon">📰</span><span>英文</span>
  </a>
  <a href="review.html" class="nav-item" data-href="review.html">
    <span class="nav-icon">🧠</span><span>復習</span>
  </a>
  <a href="vocabulary.html" class="nav-item active" data-href="vocabulary.html">
    <span class="nav-icon">📚</span><span>単語帳</span>
  </a>
</nav>

<!-- Word Detail Modal -->
<div class="modal-backdrop" id="word-detail-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">単語の詳細</span>
      <button class="modal-close" onclick="closeModal('word-detail-modal')">✕</button>
    </div>

    <div class="detail-word-display" id="detail-word">—</div>
    <div class="detail-source" id="detail-source">—</div>

    <div class="detail-context" id="detail-context"></div>

    <!-- Japanese meaning -->
    <div class="form-group">
      <label class="form-label">
        🇯🇵 日本語の意味
        <span style="font-size:0.7rem;font-weight:400;color:var(--text-muted);margin-left:6px;">(登録時に自動取得・手動修正可)</span>
      </label>
      <input type="text" class="form-input" id="detail-jp-meaning"
        placeholder="日本語の意味を入力…"
        style="font-size:0.95rem;">
    </div>

    <div class="form-group">
      <label class="form-label">メモ（使い方・例文など）</label>
      <textarea class="form-textarea" id="detail-memo" rows="3"
        placeholder="使い方・例文など自由に記入…" style="min-height:72px;"></textarea>
    </div>

    <div class="detail-meta-row">
      <div class="detail-meta-item">
        <div class="detail-meta-val" id="detail-review-count">—</div>
        <div class="detail-meta-lbl">復習回数</div>
      </div>
      <div class="detail-meta-item">
        <div class="detail-meta-val" id="detail-last-reviewed">—</div>
        <div class="detail-meta-lbl">最終復習日</div>
      </div>
    </div>

    <div class="next-review-info" id="detail-next-review"></div>

    <!-- Mastered toggle -->
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:10px 12px;background:var(--bg);border-radius:var(--radius-sm);">
      <span style="font-size:0.85rem;font-weight:600;flex:1;">習得済みとしてマーク</span>
      <label style="position:relative;display:inline-block;width:44px;height:24px;cursor:pointer;">
        <input type="checkbox" id="detail-mastered" style="opacity:0;width:0;height:0;">
        <span id="toggle-track" style="
          position:absolute;inset:0;
          background:var(--border);border-radius:999px;transition:0.2s;
        "></span>
        <span id="toggle-thumb" style="
          position:absolute;left:3px;top:3px;
          width:18px;height:18px;border-radius:50%;
          background:#fff;transition:0.2s;
          box-shadow:0 1px 4px rgba(0,0,0,0.2);
        "></span>
      </label>
    </div>

    <div class="modal-footer">
      <button class="btn btn-danger btn-sm" id="btn-delete-word">
        <i class="fa fa-trash"></i> 削除
      </button>
      <button class="btn btn-ghost" onclick="closeModal('word-detail-modal')">キャンセル</button>
      <button class="btn btn-primary" id="btn-save-word">
        <i class="fa fa-check"></i> 保存
      </button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="js/app.js"></script>
<script>
// ---- State ----
let allWords = [];
let filteredWords = [];
let currentPage = 1;
const PAGE_SIZE = 20;
let currentFilter = 'all';
let searchQuery = '';
let editingWordId = null;

// ---- Load all words ----
async function loadAllWords() {
  try {
    const res = await API.get('vocabulary', { limit: 500 });
    allWords = res.data || [];
    updateOverview();
    applyFiltersAndRender();
  } catch (e) {
    showToast('データの読み込みに失敗しました', 'error');
  }
}

function updateOverview() {
  const now = Date.now();
  const due = allWords.filter(w => {
    if (w.is_mastered) return false;
    if (!w.next_review_at) return true;
    return Number(w.next_review_at) <= now;
  });
  const mastered = allWords.filter(w => w.is_mastered);

  document.getElementById('ov-total').textContent = allWords.length;
  document.getElementById('ov-due').textContent = due.length;
  document.getElementById('ov-mastered').textContent = mastered.length;
  document.getElementById('total-count-label').textContent =
    allWords.length > 0 ? `(${allWords.length}語)` : '';
}

function setFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.filter === filter);
  });
  currentPage = 1;
  applyFiltersAndRender();
}

function applyFiltersAndRender() {
  const now = Date.now();
  const sort = document.getElementById('sort-select').value;
  const q = searchQuery.toLowerCase();

  // Filter
  let result = allWords.filter(w => {
    const matchSearch = !q
      || w.word.toLowerCase().includes(q)
      || (w.article_title || '').toLowerCase().includes(q)
      || (w.memo || '').toLowerCase().includes(q);
    if (!matchSearch) return false;

    if (currentFilter === 'due') {
      if (w.is_mastered) return false;
      if (!w.next_review_at) return true;
      return Number(w.next_review_at) <= now;
    }
    if (currentFilter === 'mastered') return w.is_mastered;
    if (currentFilter === 'new') return !w.is_mastered && (Number(w.review_count) || 0) === 0;
    return true;
  });

  // Sort
  result = result.sort((a, b) => {
    if (sort === 'alpha') return a.word.localeCompare(b.word);
    if (sort === 'oldest') return Number(a.created_at) - Number(b.created_at);
    if (sort === 'review') return (Number(b.review_count) || 0) - (Number(a.review_count) || 0);
    return Number(b.created_at) - Number(a.created_at); // newest
  });

  filteredWords = result;
  renderPage();
}

function loadWords() {
  currentPage = 1;
  applyFiltersAndRender();
}

function renderPage() {
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageWords = filteredWords.slice(start, start + PAGE_SIZE);
  renderWordList(pageWords);
  renderPagination();
}

function renderWordList(words) {
  const container = document.getElementById('word-list');
  if (words.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📚</div>
        <p>${searchQuery || currentFilter !== 'all'
          ? '条件に一致する単語がありません'
          : '単語がまだ登録されていません'}</p>
        ${currentFilter === 'all' && !searchQuery
          ? `<a href="articles.html" class="btn btn-primary">
              <i class="fa fa-newspaper"></i> 英文を追加して単語を登録
             </a>` : ''}
      </div>`;
    return;
  }

  const now = Date.now();
  container.innerHTML = words.map(w => {
    const isMastered = w.is_mastered;
    const isDue = !isMastered && (
      !w.next_review_at || Number(w.next_review_at) <= now
    );
    const reviewCount = Number(w.review_count) || 0;

    let statusBadge = '';
    if (isMastered) statusBadge = `<span class="badge badge-green">✅ 習得</span>`;
    else if (isDue)  statusBadge = `<span class="badge badge-amber">🔔 復習</span>`;
    else             statusBadge = `<span class="badge badge-gray">💤 待機中</span>`;

    return `
      <div class="word-item${isMastered ? ' mastered' : ''}" onclick="openWordDetail('${w.id}')">
        <div class="word-avatar">${escapeHtml(w.word.charAt(0))}</div>
        <div class="word-body">
          <div class="word-name">${escapeHtml(w.word)}</div>
          <div class="word-context-preview">
            ${w.japanese_meaning
              ? `<span style="color:var(--primary);font-weight:600;">${escapeHtml(truncate(w.japanese_meaning, 32))}</span>`
              : w.memo
                ? `<span style="color:var(--text-secondary);font-style:italic;">${escapeHtml(truncate(w.memo, 50))}</span>`
                : escapeHtml(truncate(w.context || (w.article_title ? `📰 ${w.article_title}` : '—'), 50))}
          </div>
        </div>
        <div class="word-right">
          ${statusBadge}
          <div class="review-count-dot" title="${reviewCount}回復習済み">${reviewCount}</div>
        </div>
      </div>`;
  }).join('');
}

function renderPagination() {
  const totalPages = Math.ceil(filteredWords.length / PAGE_SIZE);
  const container = document.getElementById('pagination');
  if (totalPages <= 1) { container.innerHTML = ''; return; }
  let html = '';
  const maxShow = 7;
  for (let p = 1; p <= totalPages; p++) {
    if (totalPages > maxShow && p > 3 && p < totalPages - 2 && Math.abs(p - currentPage) > 1) {
      if (p === 4 || p === totalPages - 3) html += `<span style="color:var(--text-muted);padding:0 4px;">…</span>`;
      continue;
    }
    html += `<button class="btn btn-sm ${p === currentPage ? 'btn-primary' : 'btn-ghost'}"
      onclick="goPage(${p})">${p}</button>`;
  }
  container.innerHTML = html;
}

function goPage(p) {
  currentPage = p;
  renderPage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ---- Word Detail Modal ----
function openWordDetail(id) {
  const w = allWords.find(x => x.id === id);
  if (!w) return;
  editingWordId = id;

  document.getElementById('detail-word').textContent = w.word;
  document.getElementById('detail-source').textContent =
    w.article_title ? `📰 ${w.article_title}` : '—';

  const context = w.context || '';
  const highlighted = context.replace(
    new RegExp('\\b' + w.word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'gi'),
    m => `<span class="hl">${m}</span>`
  );
  document.getElementById('detail-context').innerHTML =
    context
      ? highlighted
      : `<span style="color:var(--text-muted);font-style:italic;">コンテキストなし</span>`;

  document.getElementById('detail-jp-meaning').value = w.japanese_meaning || '';
  document.getElementById('detail-memo').value = w.memo || '';
  document.getElementById('detail-review-count').textContent = w.review_count || 0;
  document.getElementById('detail-last-reviewed').textContent =
    w.last_reviewed_at ? formatDate(w.last_reviewed_at) : '未復習';

  const now = Date.now();
  const nextMs = Number(w.next_review_at);
  if (w.is_mastered) {
    document.getElementById('detail-next-review').textContent = '✅ 習得済みとしてマーク済み';
  } else if (nextMs && nextMs > now) {
    const daysLeft = Math.ceil((nextMs - now) / 86400000);
    document.getElementById('detail-next-review').textContent =
      `🗓 次回復習予定: ${daysLeft}日後（${formatDate(w.next_review_at)}）`;
  } else {
    document.getElementById('detail-next-review').textContent = '🔔 今すぐ復習できます';
  }

  // Mastered toggle
  const cb = document.getElementById('detail-mastered');
  cb.checked = !!w.is_mastered;
  updateToggleVisual(!!w.is_mastered);

  openModal('word-detail-modal');
}

// Toggle visual
document.getElementById('detail-mastered').addEventListener('change', function() {
  updateToggleVisual(this.checked);
});
function updateToggleVisual(checked) {
  document.getElementById('toggle-track').style.background = checked ? 'var(--success)' : 'var(--border)';
  document.getElementById('toggle-thumb').style.left = checked ? '23px' : '3px';
}

// Save word detail
document.getElementById('btn-save-word').addEventListener('click', async () => {
  if (!editingWordId) return;
  const jpMeaning  = document.getElementById('detail-jp-meaning').value.trim();
  const memo       = document.getElementById('detail-memo').value.trim();
  const isMastered = document.getElementById('detail-mastered').checked;
  try {
    await API.patch('vocabulary', editingWordId, {
      japanese_meaning: jpMeaning,
      memo,
      is_mastered: isMastered
    });
    const idx = allWords.findIndex(w => w.id === editingWordId);
    if (idx !== -1) {
      allWords[idx].japanese_meaning = jpMeaning;
      allWords[idx].memo       = memo;
      allWords[idx].is_mastered = isMastered;
    }
    closeModal('word-detail-modal');
    showToast('保存しました', 'success');
    updateOverview();
    applyFiltersAndRender();
  } catch (e) { showToast('保存に失敗しました', 'error'); }
});

// Delete word
document.getElementById('btn-delete-word').addEventListener('click', async () => {
  if (!editingWordId) return;
  const w = allWords.find(x => x.id === editingWordId);
  if (!confirm(`「${w?.word}」を削除しますか？`)) return;
  try {
    await API.delete('vocabulary', editingWordId);
    allWords = allWords.filter(x => x.id !== editingWordId);
    closeModal('word-detail-modal');
    showToast('削除しました');
    updateOverview();
    applyFiltersAndRender();
  } catch (e) { showToast('削除に失敗しました', 'error'); }
});

// ---- Search ----
let searchTimer = null;
document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchQuery = e.target.value.trim();
  searchTimer = setTimeout(() => {
    currentPage = 1;
    applyFiltersAndRender();
  }, 350);
});

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ---- Init ----
loadAllWords();

// Check for URL param (article filter)
const articleFilter = getParam('article');
if (articleFilter) {
  document.getElementById('search-input').value = articleFilter;
  searchQuery = articleFilter;
}
</script>
</body>
</html>
