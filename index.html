<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WordLens — ダッシュボード</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Dashboard-specific */
    .hero-section {
      padding: 36px 0 20px;
      text-align: center;
    }
    .app-logo-large {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-size: 28px;
      color: #fff;
      margin: 0 auto 16px;
      box-shadow: 0 8px 24px rgba(37,99,235,0.3);
    }
    .hero-section h1 {
      font-size: 1.8rem;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    .hero-section .tagline {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    /* Stats row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 24px 0;
    }
    .stat-mini {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 10px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .stat-mini .val {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.1;
    }
    .stat-mini .lbl {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 2px;
    }

    /* Main nav cards */
    .nav-cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 4px;
    }
    .nav-card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 20px;
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: var(--shadow-sm);
    }
    .nav-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
      border-color: var(--border-focus);
    }
    .nav-card-icon {
      width: 52px; height: 52px;
      border-radius: var(--radius-md);
      display: grid;
      place-items: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .icon-articles {
      background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%);
      color: var(--primary);
    }
    .icon-review {
      background: linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 100%);
      color: #059669;
    }
    .icon-vocab {
      background: linear-gradient(135deg, #FFF7ED 0%, #FED7AA 100%);
      color: #EA580C;
    }
    .nav-card-body { flex: 1; }
    .nav-card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 3px;
    }
    .nav-card-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .nav-card-arrow {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Due-words banner */
    .due-banner {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #fff;
      text-decoration: none;
      margin-bottom: 4px;
      box-shadow: 0 4px 20px rgba(37,99,235,0.3);
      transition: transform var(--transition), box-shadow var(--transition);
    }
    .due-banner:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(37,99,235,0.35); }
    .due-banner .due-icon { font-size: 28px; }
    .due-banner .due-body { flex: 1; }
    .due-banner .due-title { font-weight: 700; font-size: 0.95rem; }
    .due-banner .due-sub   { font-size: 0.8rem; opacity: 0.85; margin-top: 1px; }
    .due-banner .due-count {
      font-size: 2rem; font-weight: 800; line-height: 1;
    }
    .due-banner.hidden { display: none; }

    /* Recent words */
    .recent-list { display: flex; flex-direction: column; gap: 8px; }
    .recent-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .recent-word {
      font-weight: 700;
      color: var(--primary);
      font-size: 0.95rem;
      flex: 1;
    }
    .recent-date { font-size: 0.75rem; color: var(--text-muted); }
  </style>
</head>
<body>

<!-- Header -->
<header class="app-header">
  <div class="app-header-inner">
    <a href="index.html" class="logo">
      <span class="logo-icon"><i class="fa fa-book-open"></i></span>
      WordLens
    </a>
    <span style="font-size:0.8rem;color:var(--text-muted);">英単語学習</span>
  </div>
</header>

<!-- Main -->
<main class="app-container">

  <!-- Hero -->
  <div class="hero-section">
    <div class="app-logo-large"><i class="fa fa-book-open"></i></div>
    <h1>WordLens</h1>
    <p class="tagline">英文から単語を拾い、忘却曲線で定着させよう</p>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-mini">
      <div class="val" id="stat-articles">—</div>
      <div class="lbl">登録英文</div>
    </div>
    <div class="stat-mini">
      <div class="val" id="stat-words">—</div>
      <div class="lbl">単語数</div>
    </div>
    <div class="stat-mini">
      <div class="val" id="stat-mastered">—</div>
      <div class="lbl">習得済み</div>
    </div>
  </div>

  <!-- Due words banner -->
  <a href="review.html?mode=due" class="due-banner hidden" id="due-banner">
    <span class="due-icon">🔔</span>
    <div class="due-body">
      <div class="due-title">復習タイムです！</div>
      <div class="due-sub">忘却曲線に基づく復習単語あり</div>
    </div>
    <div class="due-count" id="due-count">0</div>
  </a>

  <!-- Recent Words -->
  <div class="section-header" id="recent-section" style="display:none;">
    <span class="section-title">最近追加した単語</span>
    <a href="vocabulary.html" style="font-size:0.8rem;color:var(--primary);text-decoration:none;font-weight:600;">すべて見る</a>
  </div>
  <div class="recent-list" id="recent-list"></div>

</main>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <a href="index.html" class="nav-item active" data-href="index.html">
    <span class="nav-icon">🏠</span>
    <span>ホーム</span>
  </a>
  <a href="articles.html" class="nav-item" data-href="articles.html">
    <span class="nav-icon">📰</span>
    <span>英文</span>
  </a>
  <a href="review.html" class="nav-item" data-href="review.html">
    <span class="nav-icon">🧠</span>
    <span>復習</span>
  </a>
  <a href="vocabulary.html" class="nav-item" data-href="vocabulary.html">
    <span class="nav-icon">📚</span>
    <span>単語帳</span>
  </a>
</nav>

<div id="toast-container"></div>

<script src="js/app.js"></script>
<script>
(async () => {
  try {
    // Fetch counts
    const [artRes, vocRes] = await Promise.all([
      API.get('articles', { limit: 1 }),
      API.get('vocabulary', { limit: 200 })
    ]);

    const totalArticles = artRes.total || 0;
    const allWords = vocRes.data || [];
    const totalWords = vocRes.total || 0;
    const mastered = allWords.filter(w => w.is_mastered).length;

    document.getElementById('stat-articles').textContent = totalArticles;
    document.getElementById('stat-words').textContent = totalWords;
    document.getElementById('stat-mastered').textContent = mastered;

    // Due words
    const now = Date.now();
    const dueWords = allWords.filter(w => {
      if (w.is_mastered) return false;
      if (!w.next_review_at) return true;
      return Number(w.next_review_at) <= now;
    });
    if (dueWords.length > 0) {
      const banner = document.getElementById('due-banner');
      banner.classList.remove('hidden');
      document.getElementById('due-count').textContent = dueWords.length;
    }

    // Recent words (last 5)
    const recent = [...allWords]
      .sort((a, b) => Number(b.created_at) - Number(a.created_at))
      .slice(0, 5);
    if (recent.length > 0) {
      document.getElementById('recent-section').style.display = 'flex';
      const list = document.getElementById('recent-list');
      list.innerHTML = recent.map(w => `
        <div class="recent-item">
          <span class="recent-word">${w.word}</span>
          <span class="badge badge-gray">${w.article_title ? truncate(w.article_title, 20) : '—'}</span>
          <span class="recent-date">${formatDate(w.created_at)}</span>
        </div>
      `).join('');
    }
  } catch (e) {
    console.error(e);
  }
})();
</script>
</body>
</html>
